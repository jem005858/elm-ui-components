name: Elm Frontend Engine Pipeline

on:
  schedule:
    # Wakes up at 11 minutes past 1 AM, 7 AM, 1 PM, and 7 PM UTC
    # (9:11 AM, 3:11 PM, 9:11 PM, and 3:11 AM Singapore Time)
    - cron: '11 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  elm-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate Elm Type Definitions
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Elm type specs current. Skipping execution."
            exit 0
          fi

          mkdir -p src
          TARGET_FILE="src/Types.elm"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "module Types exposing (..)" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "{-| Core Elm Architecture State Models -}" >> "$TARGET_FILE"
          fi

          COMPONENTS=("UserViewState" "NavigationNode" "ThemeConfig" "MetricPayload" "SessionModel")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "{-| State node payload $RANDOM -}" >> "$TARGET_FILE"
          echo "type alias ${PICKED_COMP}_$RANDOM =" >> "$TARGET_FILE"
          echo "    { id : Int" >> "$TARGET_FILE"
          echo "    , active : Bool" >> "$TARGET_FILE"
          echo "    }" >> "$TARGET_FILE"

          git config --global user.name "jem005858"
          git config --global user.email "jem005858@gmail.com"

          MESSAGES=(
            "feat: add Elm type alias representation for architecture model"
            "refactor: optimize record field definitions in Types module"
            "fix: adjust record type signatures for Elm view state"
            "chore: sync Elm architecture module specifications"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add src/
          git commit -m "$MSG"
          git push
